[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvx"
version = "0.3.0"
description = "Indoor environmental quality (IEQ) analytics for buildings: EN 16798-1, TAIL, BR18, live monitoring and IFC/Brick interoperability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary License"}
authors = [
    {name = "HVX", email = "bruno.adam@pm.me"}
]
keywords = ["ieq", "indoor-environment", "en16798", "building", "brick-schema", "ifc", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Kept deliberately lean: everything here has wheels for glibc and musl
# (Home Assistant OS) platforms. Heavier features are extras.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "holidays>=0.42",
    "click>=8.1",
]

[project.optional-dependencies]
brick = ["rdflib>=7.0"]
ifc = ["ifcopenshell>=0.8.0"]
chirpstack = ["paho-mqtt>=2.0", "chirpstack-api>=4.0"]  # LoRaWAN via ChirpStack (MQTT, gRPC API)
comfort = ["pythermalcomfort>=2.8"]  # EN 16798 adaptive model via pythermalcomfort (pulls numba)
ml = ["scikit-learn>=1.3"]  # isolation-forest outlier detection
api = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.32"]
all = ["hvx[brick,ifc,chirpstack,comfort,ml,api]"]
dev = [
    "hvx[brick,ifc,chirpstack,api]",
    "amqtt>=0.11",  # in-process MQTT broker for the ChirpStack tests
    "pytest>=7.4",
    "httpx>=0.27",
    "brickschema>=0.7",
    "build>=1.0",
]

[project.scripts]
hvx = "hvx.cli:cli"

[project.urls]
Homepage = "https://brunoadam.eu/"
Repository = "https://github.com/bruadam/hvx"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hvx*"]

[tool.setuptools.package-data]
"hvx.core" = ["py.typed", "semantics/ontology/*.ttl", "config/**/*.yaml"]
"hvx.reporting" = ["templates/*.j2"]
"hvx.standards" = ["*/config.yaml", "*/docs/*"]
"hvx.simulations" = ["models/*/config.yaml"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers"
]

[tool.coverage.run]
source = ["hvx"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
