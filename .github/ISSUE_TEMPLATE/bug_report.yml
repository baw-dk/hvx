name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hvx Python package / CLI
        - Home Assistant integration (hvx_ieq)
        - Live data (Home Assistant source, ChirpStack, site files)
        - Reports
        - Standards (EN 16798, TAIL, BR18)
        - IFC / Brick
        - API / flow editor
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps or data. Use synthetic data — no client, building or personal identifiers, no tokens.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`hvx --version`, Python version, Home Assistant version if relevant"
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: For the integration, attach the diagnostics download (Settings → Devices & services → HVX → ⋮).
      render: text
