name: Release to PyPI

# Push a tag vX.Y.Z (matching pyproject.toml) to publish. PyPI trusted publishing:
# no token is stored; PyPI trusts this workflow through GitHub's OIDC identity.
# One-time setup on pypi.org -> Publishing -> pending publisher:
#   project hvx, owner baw-dk, repository hvx, workflow release.yml, environment pypi

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
          python scripts/check_versions.py
      - name: Build
        run: python -m pip install --upgrade build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hvx
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
