name: CLA

# Contributors sign CLA.md once by commenting on their pull request.
# Signatures are stored on the `cla-signatures` branch (see docs/contributing/cla.md).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write # store signatures on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # contributor-assistant/github-action v2.6.1 (pinned by commit)
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # The maintainer (licensor) and automation accounts do not sign.
          allowlist: bruadam,dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please sign the
            [HVX Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md)
            ([why](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/contributing/cla.md)).
            It is a license, not a copyright transfer: you keep ownership of your work.
            To sign, reply to this pull request with the sentence below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
