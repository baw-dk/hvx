name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  hygiene:
    name: License headers and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: MPL-2.0 notice on every source file
        run: python scripts/license_headers.py --check
      - name: Package and integration versions in step
        run: python scripts/check_versions.py

  library:
    name: Library (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Build distributions
        run: python -m build && pip install twine && twine check dist/*

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component -e .
      - name: Run integration tests
        working-directory: tests_ha
        run: pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # The HACS action can only validate public repositories.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
