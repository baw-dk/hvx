name: TAIL label web app

# Builds web/ (React + shadcn/ui, hvx running in the browser via Pyodide), runs the
# end-to-end test, and publishes to GitHub Pages from main. Served at
# https://<owner>.github.io/hvx/ and, through a rewrite on the BAW site, at
# https://app.brunoadam.eu/hvx/ (see web/README.md).

on:
  push:
    branches: [main]
    paths: ["web/**", "src/hvx/**", "pyproject.toml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "src/hvx/**", "pyproject.toml", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          python -m pip install build
          npm ci
      - name: Vendor Pyodide, wheels and the hvx wheel of this commit
        run: PYTHON=python npm run vendor
      - name: Build (base /hvx/)
        run: npm run build
      - name: End-to-end test in Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/e2e.mjs e2e-output
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e-output/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
