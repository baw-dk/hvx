id: "br18"
name: "BR18 Danish Building Regulations"
version: "2018.0"
standard_type: "BR18"
category_based: false
description: "Danish building regulations 2018 - Indoor climate requirements for workplace and buildings"

applicability:
  countries: ["DK"]
  regions: ["Denmark"]
  continents: ["Europe"]
  building_types: ["office", "school", "classroom", "meeting_room", "daycare", "residential", "industrial", "retail"]
  seasons: ["all_year"]

required_inputs:
  temperature: true
  co2: true
  ventilation_rate: false
  bathroom_exhaust_flow: false
  wc_utility_exhaust_flow: false
  kitchen_exhaust_flow: false
  kitchen_hood_flow: false

allow_partial_analysis: false

# BR18 Indoor Climate Rules
# How hvx applies these rules to MEASURED data:
# - The 100 h > 26 °C / 25 h > 27 °C values come from the BR18 guidance on thermal indoor
#   climate (Bygningsreglementets vejledning om termisk indeklima, to § 385), where they
#   normally satisfy the requirement for offices and are documented by calculation for a
#   reference year. For other non-residential buildings (e.g. schools) the building owner
#   sets the hours. hvx applies them to measured occupied hours of a whole year, once
#   (not per season), as an indicator.
# - § 447 (1000 ppm CO2 in teaching rooms and day-care) is a design requirement ("for de
#   dimensionerende forhold"). hvx reports measured hours above 1000 ppm against it with no
#   allowance, as an indicator ("assessment: indicative").
rules:
  # Thermal comfort (BR18 Termisk indeklima vejledning kap. 1.0)
  - id: "br18_nonres_temp_26"
    name: "Above 26 °C at most 100 h per year (BR18 guidance value)"
    metric: "temperature"
    operator: "<="
    target_value: 26.0
    unit: "°C"
    tolerance_hours: 100
    applies_during: "occupied"
    season: "all_year"  # hours per year of use
    applicable_building_types: ["office", "school", "classroom", "meeting_room", "daycare", "industrial", "retail"]
    source_section: "BR18 vejledning kap. 1.0"
    source_url: "https://www.bygningsreglementet.dk/media/n5hjvonl/termisk-indeklima.pdf"
    description: "Andre bygninger end boliger skal dokumentere, at operative temperaturer over 26 °C kun forekommer op til 100 brugstimer årligt."

  - id: "br18_nonres_temp_27"
    name: "Above 27 °C at most 25 h per year (BR18 guidance value)"
    metric: "temperature"
    operator: "<="
    target_value: 27.0
    unit: "°C"
    tolerance_hours: 25
    applies_during: "occupied"
    season: "all_year"  # hours per year of use
    applicable_building_types: ["office", "school", "classroom", "meeting_room", "daycare", "industrial", "retail"]
    source_section: "BR18 vejledning kap. 1.0"
    source_url: "https://www.bygningsreglementet.dk/media/n5hjvonl/termisk-indeklima.pdf"
    description: "Operative temperaturer over 27 °C må højst forekomme i 25 timer pr. år i brugstiden for ikke-beboelsesbygninger."

  - id: "br18_res_temp_27"
    name: "Residential operative temperature ≤27°C"
    metric: "temperature"
    operator: "<="
    target_value: 27.0
    unit: "°C"
    tolerance_hours: 100
    applies_during: "occupied"
    season: "all_year"  # hours per year of use
    applicable_building_types: ["residential"]
    source_section: "BR18 vejledning kap. 1.0"
    source_url: "https://www.bygningsreglementet.dk/media/n5hjvonl/termisk-indeklima.pdf"
    description: "Boliger med mulighed for udluftning bør højst have 100 brugstimer pr. år med operative temperaturer over 27 °C."

  - id: "br18_res_temp_28"
    name: "Residential operative temperature ≤28°C"
    metric: "temperature"
    operator: "<="
    target_value: 28.0
    unit: "°C"
    tolerance_hours: 25
    applies_during: "occupied"
    season: "all_year"  # hours per year of use
    applicable_building_types: ["residential"]
    source_section: "BR18 vejledning kap. 1.0"
    source_url: "https://www.bygningsreglementet.dk/media/n5hjvonl/termisk-indeklima.pdf"
    description: "Der må højst forekomme 25 brugstimer pr. år over 28 °C i boligens rum, når udluftning er mulig."

  # Residential ventilation (BR18 § 443)
  - id: "br18_residential_air_supply"
    name: "Residential outdoor air supply (occupied)"
    metric: "ventilation_rate"
    operator: ">="
    target_value: 0.30
    unit: "L/s per m2"
    applies_during: "occupied"
    applicable_building_types: ["residential"]
    season: "all_year"
    source_section: "BR18 § 443, stk. 1"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/443_446/#7e3ed2f3-9f5b-47e8-b41c-723a75ec3009"
    description: "Beboelsesrum og boligen som helhed skal have en udelufttilførsel på mindst 0,30 L/s pr. m2 opvarmet etageareal under normal brug."

  - id: "br18_residential_reduced_air_supply"
    name: "Residential reduced air supply (allowed inactivity)"
    metric: "ventilation_rate"
    operator: ">="
    target_value: 0.15
    unit: "L/s per m2"
    applies_during: "unoccupied"
    applicable_building_types: ["residential"]
    season: "all_year"
    source_section: "BR18 § 443, stk. 1"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/443_446/#7e3ed2f3-9f5b-47e8-b41c-723a75ec3009"
    description: "Når ventilationen kan dokumenteres behovsstyret, kan lufttilførslen reduceres til 0,15 L/s pr. m2 i længere perioder, hvor boligen ikke er i anvendelse."

  - id: "br18_residential_bathroom_exhaust"
    name: "Bathroom exhaust airflow"
    metric: "bathroom_exhaust_flow"
    operator: ">="
    target_value: 15.0
    unit: "L/s"
    applies_during: "occupied"
    applicable_building_types: ["residential"]
    source_section: "BR18 § 443, stk. 5"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/443_446/#7e3ed2f3-9f5b-47e8-b41c-723a75ec3009"
    description: "Bade- og wc-rum i boliger skal kunne udsuge mindst 15 L/s for at fjerne fugt og forureninger."

  - id: "br18_residential_wc_utility_exhaust"
    name: "WC and utility exhaust airflow"
    metric: "wc_utility_exhaust_flow"
    operator: ">="
    target_value: 10.0
    unit: "L/s"
    applies_during: "occupied"
    applicable_building_types: ["residential"]
    source_section: "BR18 § 443, stk. 5"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/443_446/#7e3ed2f3-9f5b-47e8-b41c-723a75ec3009"
    description: "WC-rum uden bad og bryggers i boliger skal kunne udsuge mindst 10 L/s."

  - id: "br18_residential_kitchen_exhaust"
    name: "Residential kitchen exhaust airflow"
    metric: "kitchen_exhaust_flow"
    operator: ">="
    target_value: 20.0
    unit: "L/s"
    applies_during: "occupied"
    applicable_building_types: ["residential"]
    source_section: "BR18 § 443, stk. 5"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/443_446/#7e3ed2f3-9f5b-47e8-b41c-723a75ec3009"
    description: "Køkkener i boliger skal have udsugning på mindst 20 L/s for grundluftsskiftet."

  - id: "br18_kitchen_hood_flow"
    name: "Residential hood capture airflow"
    metric: "kitchen_hood_flow"
    operator: ">="
    target_value: 120.0
    unit: "L/s"
    applies_during: "cooking"
    applicable_building_types: ["residential"]
    source_section: "BR18 § 443, stk. 3-4"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/443_446/#7e3ed2f3-9f5b-47e8-b41c-723a75ec3009"
    description: "Emhætter skal have mekanisk udsugning med afkast til det fri og en luftstrøm på mindst 120 L/s, med mulighed for reduktion via dokumenterede korrektionsfaktorer eller 75 % emopfangsevne."

  # Schools, classrooms and day-care (BR18 § 447)
  - id: "br18_school_co2_max"
    name: "CO2 in teaching rooms at most 1000 ppm (§ 447, design requirement)"
    metric: "co2"
    operator: "<="
    target_value: 1000
    unit: "ppm"
    tolerance_hours: 0
    assessment: "indicative"  # design requirement; measured data is an indicator
    applies_during: "occupied"
    applicable_building_types: ["school", "classroom", "meeting_room", "daycare"]
    season: "all_year"
    source_section: "BR18 § 447"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/447/#dcb71b0d-4d4f-404f-aa62-26950e0c0685"
    description: "Opholdsrum i daginstitutioner og undervisningsrum skal dimensioneres, så CO2-indholdet ikke overstiger 1.000 ppm i de dimensionerende perioder."

  - id: "br18_school_min_air_supply"
    name: "Educational spaces minimum air supply"
    metric: "ventilation_rate"
    operator: ">="
    target_value: 0.35
    unit: "L/s per m2"
    applies_during: "occupied"
    applicable_building_types: ["school", "classroom", "meeting_room", "daycare"]
    season: "all_year"
    source_section: "BR18 § 447, stk. 3"
    source_url: "https://www.bygningsreglementet.dk/tekniske-bestemmelser/22/krav/447/#dcb71b0d-4d4f-404f-aa62-26950e0c0685"
    description: "Ved behovsstyret ventilation må luftmængden i brugstiden ikke komme under 0,35 L/s pr. m2 etageareal i undervisningsrum og daginstitutioners opholdsrum."

# Ventilation requirements (informational)
ventilation_requirements:
  residential:
    base_outdoor_air_l_s_m2: 0.30
    reduced_outdoor_air_l_s_m2: 0.15
    bathroom_exhaust_l_s: 15.0
    wc_utility_exhaust_l_s: 10.0
    kitchen_exhaust_l_s: 20.0
    kitchen_hood_l_s: 120.0
  education:
    max_co2_ppm: 1000
    min_air_supply_l_s_m2: 0.35

# Additional guidelines
guidelines:
  air_quality: "Maintain good indoor air quality with effective ventilation systems"
  energy_efficiency: "Building should be as energy efficient as possible"
  co2_levels: "Ensure low CO2 levels through effective ventilation systems"

analysis_module: "hvx.standards.br18.analysis:run"

# Aggregation configuration for building and portfolio levels
aggregation:
  aggregate_to_types: ["floor", "building", "portfolio"]
  # For BR18, we aggregate by summing non-compliant hours and counting passing rooms
  aggregation_method: "sum"  # Sum non-compliant hours across rooms
  spatial_method: "sum"  # Sum hours across spatial entities
  rollup_targets:
    - field: "overall_pass"
      method: "count_true"  # Count how many rooms pass overall
    - field: "rules.*.non_compliant_hours"  # Sum non-compliant hours per rule
      method: "sum"
    - field: "rules.*.violations_hours"  # Sum violation hours per rule
      method: "sum"
    - field: "rules.*.passed"  # Count how many rooms pass each rule
      method: "count_true"
